name: CMake

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macOS-latest]
    steps:
      - uses: ./.github/actions/build-steps


  container_build:
    name: Build in container ${{ matrix.container }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        container: [alpine:edge, ubuntu:latest]
    steps:
      - uses: ./.github/actions/build-steps
